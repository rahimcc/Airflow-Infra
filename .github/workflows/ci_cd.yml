name: CI and CD pipeline

on:
    workflow_dispatch: 
    push: 
        branches: [main]
    
    pull_request:
        branches: [main]

   

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

jobs: 
    test:

        runs-on: ubuntu-latest
        steps:
          - name: Checkout Code
            uses: actions/checkout@v5

          - name: Install Python
            uses: actions/setup-python@v5

            with: 
                  python-version: 3.12

          - name: Install dependencies
            run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt
              
    
    build-and-push:
        needs: test
        runs-on: ubuntu-latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        permissions:
            contents: read
            packages: write   # required to push to GHCR
 
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3
 
            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                registry: ${{ env.REGISTRY }}
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}
 

            - name: Extract metadata (tags, labels)
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                    type=raw,value=latest
                    type=sha,format=short
 
            - name: Build and push image
              uses: docker/build-push-action@v6
              with:
                context: .
                push: true
                tags: ${{ steps.meta.outputs.tags }}
                labels: ${{ steps.meta.outputs.labels }}
                cache-from: type=gha
                cache-to: type=gha,mode=max

    deploy:
        runs-on: ubuntu-latest
        needs: build-and-push
        environment: production
        steps:

            - name: Debug (temporary)
              run: |
                echo "Host length ${#AIRFLOW_VM_HOST}"
              env: 
                AIRFLOW_VM_HOST: ${{ secrets.AIRFLOW_VM_HOST }}

            - name: SSH and deploy  
              uses: appleboy/ssh-action@v1
              with:
                  host: ${{ secrets.AIRFLOW_VM_HOST }}
                  username: ${{ secrets.AIRFLOW_VM_USER }}
                  key: ${{ secrets.AIRFLOW_SSH_KEY }}
                  script: |
                        echo "Successful" 
                        cd /opt/Airflow-Infra
                        git pull origin main
                        sudo ./deploy.sh production
