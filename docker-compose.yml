
x-airflow-common: &airflow-common
  image: ghcr.io/rahimcc/turyan-airflow-infra:latest
  build: .
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__LOAD_DEFAULT_CONNECTIONS: 'false'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL:  'http://airflow-webserver:8080/execution/'
    
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET}
    AIRFLOW__API_AUTH__JWT_ISSUER: airflow

    # --- concurrency: keep low, we only have 1 vCPU ---
    AIRFLOW__CORE__PARALLELISM: 4
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: 4
    AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: 1
    AIRFLOW__SCHEDULER__PARSING_PROCESSES: 1
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: '60'
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: '120'
    AIRFLOW__SCHEDULER__SCHEDULER_HEARTBEAT_SEC: '15'

    # --- webserver: single gunicorn worker, no autoreload ---
    AIRFLOW__WEBSERVER__WORKERS: 1
    AIRFLOW__WEBSERVER__WORKER_REFRESH_BATCH_SIZE: 1
    AIRFLOW__WEBSERVER__WORKER_REFRESH_INTERVAL: '6000'
    AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT: '300'

    # --- logging: don't let logs fill disk, skip json serialization overhead ---
    AIRFLOW__LOGGING__LOGGING_LEVEL: 'INFO'
    AIRFLOW__ELASTICSEARCH__JSON_FORMAT: 'false'

    # --- misc trims ---
    AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: '60'
    AIRFLOW__CORE__CHECK_SLAS: 'false'
    AIRFLOW__METRICS__STATSD_ON: 'false'
    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-}

    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

  volumes:
    - ${DAGS_HOST_PATH}:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./config/airflow.cfg:/opt/airflow/airflow.cfg:ro
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # tuned down for a 1-CPU/6GB host — postgres defaults assume much more
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command: >
      postgres
        -c shared_buffers=128MB
        -c max_connections=30
        -c work_mem=4MB
        -c maintenance_work_mem=32MB
        -c effective_cache_size=512MB
        -c wal_buffers=4MB
        -c max_wal_size=512MB
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: always


  airflow-init:
    <<: *airflow-common
    command:
      - bash 
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${_AIRFLOW_WWW_USER_USERNAME}" \
          --password "${_AIRFLOW_WWW_USER_PASSWORD}" \
          --firstname Rahim --lastname Rahim --role Admin \
          --email admin@example.com || true
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
    depends_on: *airflow-common-depends-on

  airflow-webserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 2560M
        reservations:
          memory: 768M

  caddy:
    image: caddy:2-alpine
    profiles: ["production"]
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
       airflow-webserver:
        condition: service_healthy
          

volumes:
  postgres-db-volume:
  caddy-data: {}
  caddy-config: {}
